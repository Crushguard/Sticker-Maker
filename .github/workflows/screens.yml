name: Screen tour

# Runs the real app on an Android emulator against the Firebase emulators,
# walks every design frame (ScreenTourTest) and publishes the screenshots with
# the screen map to the `screenshots` branch.
on:
  push:
    branches: ["claude/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOUR_OUT: build/screen-tour
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space for the emulator
        # Hosted runners ship toolchains this job never uses; without them gone
        # the AVD's data partition does not fit next to the build.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build the app, the tour and the WhatsApp stub
        id: build
        run: >
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :whatsapp-stub:assembleDebug
          -PfirebaseEmulatorHost=10.0.2.2 --stacktrace --no-daemon

      - name: Start the Firebase emulators and seed the catalog
        run: |
          npm ci --prefix scripts --no-audit --no-fund
          npm install -g firebase-tools@14 --no-audit --no-fund
          PROJECT=$(jq -r .project_info.project_id app/google-services.json)
          BUCKET=$(jq -r .project_info.storage_bucket app/google-services.json)
          echo "Emulating project $PROJECT, bucket $BUCKET"
          JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH" \
            nohup firebase emulators:start --only firestore,storage --project "$PROJECT" \
            > "$RUNNER_TEMP/firebase-emulators.log" 2>&1 &
          for i in $(seq 1 120); do
            grep -q "All emulators ready" "$RUNNER_TEMP/firebase-emulators.log" && break
            sleep 2
          done
          grep -q "All emulators ready" "$RUNNER_TEMP/firebase-emulators.log" || { cat "$RUNNER_TEMP/firebase-emulators.log"; exit 1; }
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199 \
            node scripts/upload-pack.js --all --project "$PROJECT" --bucket "$BUCKET"

      - name: Run the screen tour
        id: tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # Sized for the 2-core, 7 GB hosted runner; the tour needs little storage.
          cores: 2
          ram-size: 3072M
          disk-size: 3000M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./scripts/ci/run-screen-tour.sh

      - name: Publish the screenshots branch
        if: always() && steps.build.outcome == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOUR_OUTCOME: ${{ steps.tour.outcome }}
        run: ./scripts/ci/publish-screens.sh

      - name: Upload the tour output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-tour
          path: |
            build/screen-tour
            ${{ runner.temp }}/firebase-emulators.log
          if-no-files-found: ignore
