# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Note: org.gradle.configuration-cache is intentionally NOT enabled. app/build.gradle.kts
# writes a placeholder google-services.json at configuration time when the real file is
# absent; the configuration cache can skip that logic on a cache hit, so correctness wins.

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
